spring.application.name=controle-estoque-perfumaria

# Conexao com o MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/controle_estoque_perfumaria?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=root
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# O Flyway gerencia a estrutura; o Hibernate apenas valida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# O banco existente ja foi registrado no Flyway
spring.flyway.baseline-on-migrate=false